 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width:100vw;
            height: 100vh;
            background-color: beige;
            border:5px solid black;
        }
        .box{
            width: 250px;
            height: 80px;
            background-color: blue;
            border:3px solid yellow;
            border-radius: 10px;
            margin: 10px;
            position: relative;
            animation-name: rightMovement;
            /* animation-duration: 5s;
            animation-iteration-count: 1;
            /* animation-fill-mode:forwards ; */
            /* animation-delay:2s; 
            animation-direction: reverse; */ 
            /* animation-timing-function: cubic-bezier(0.7,0.1,0.6,0.1); */
            animation : rightMovement 2s linear 2s 2 reverse ;
        }
            @keyframes rightMovement {
                from{
                    top:0;
                    left:0;
                }
                to{
                    top:0;
                    left:800px;
                }
                
            }
        
    </style>
 </head>
 <body>
    <div class="container">
        <div class="box"></div>
    </div>
 </body>
 </html>
