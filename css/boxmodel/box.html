<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
          height: 200px;
          width: 200px;
          border: 5px solid black;
          padding: 20px; padding-left: 20px;
           margin: 10px;margin-left: 20px;
           box-sizing: border-box; 
           /* <!--<to seperarte div tag>--> */
          
        }

        #ab{
            background-color: blue;
        }
        #cd{
            background-color: rgb(0, 0, 255); 
        }
        #ef{
            background-color: #838065;
        }

    </style>
</head>
<body>
    <div class="box" id="ab">A</div>
    <div class="box" id="ef">B</div>
    <div class="box" id="cd">C</div>
</body>
</html>
